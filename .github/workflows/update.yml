name: 刷新市场数据

on:
  schedule:
    # 注意:cron 用的是 UTC,GitHub 免费额度下可能延迟几分钟
    - cron: "30 7 * * 1-5"    # 15:30 北京 —— A 股收盘后
    - cron: "30 11 * * 1-5"   # 07:30 波士顿 —— 美股盘前
  workflow_dispatch:           # 也可以在 Actions 页面手动点一下

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装依赖
        run: pip install yfinance akshare requests

      - name: 抓数据
        env:
          # 想要 AI 摘要就在仓库 Settings → Secrets → Actions 里加这个
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fetch_market.py

      - name: 提交结果
        run: |
          git config user.name  "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/market.json
          git diff --staged --quiet || git commit -m "数据更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
